<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>NYSSRA - Markdown Editor</title>
        <link rel="shortcut icon" href="/images/nyssra-logo.jpg" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="css/global.css" />
        <link rel="stylesheet" href="css/bootstrap.css" />
        <link rel="stylesheet" href="css/bootstrap-icons.css" />
        <link rel="stylesheet" href="css/simplemde.css" />
        <script src="scripts/navbar.js"></script>
    </head>

    <body class="min-vh-100 d-flex flex-column">
        <nav></nav>

        <main class="flex-grow-1 py-4">
            <div class="container">
                <div class="row">
                    <div class="col-md-7 bg-light rounded p-4 shadow-sm">
                        <h3>Edit Markdown</h3>
                        <div class="mb-3">
                            <textarea id="markdown-editor"></textarea>
                        </div>
                    </div>

                    <div class="col-md-5">
                        <div class="mb-3">
                            <label for="post-name" class="form-label"
                                >Post Name</label
                            >
                            <span
                                data-bs-toggle="tooltip"
                                title="Used to identify and link the post. Should be unique, lowercase, and URL-friendly."
                            >
                                <i
                                    class="bi bi-question-circle-fill text-secondary"
                                    style="cursor: pointer"
                                ></i>
                            </span>
                            <input
                                type="text"
                                id="post-name"
                                class="form-control"
                                placeholder="e.g. Queensbury Invy 2025"
                            />
                        </div>
                        <div class="mb-3">
                            <label for="post-tags" class="form-label"
                                >Tags</label
                            >
                            <span
                                data-bs-toggle="tooltip"
                                title="Used to organize posts and find similar posts."
                            >
                                <i
                                    class="bi bi-question-circle-fill text-secondary"
                                    style="cursor: pointer"
                                ></i>
                            </span>
                            <input
                                type="text"
                                id="post-tags"
                                class="form-control"
                                placeholder="e.g. skiing, results, 2024"
                            />
                        </div>
                        <div class="mb-3">
                            <label for="image-upload" class="form-label"
                                >Upload Files</label
                            >
                            <span
                                data-bs-toggle="tooltip"
                                title="Click an image to insert it. Other files insert a link."
                            >
                                <i
                                    class="bi bi-question-circle-fill text-secondary"
                                    style="cursor: pointer"
                                ></i>
                            </span>
                            <input
                                type="file"
                                id="image-upload"
                                class="form-control"
                                multiple
                            />
                        </div>

                        <div class="mb-3">
                            <label class="form-label">File Preview</label>
                            <div
                                id="image-preview-container"
                                class="d-flex gap-2 overflow-auto p-2 border rounded bg-white"
                                style="white-space: nowrap; max-height: 130px"
                            ></div>
                        </div>

                        <div class="mb-3">
                            <div class="form-check">
                                <input
                                    class="form-check-input"
                                    type="checkbox"
                                    id="is-event-toggle"
                                />
                                <label
                                    class="form-check-label"
                                    for="is-event-toggle"
                                >
                                    Is this an event?
                                </label>
                            </div>
                        </div>

                        <div class="mb-3 d-none" id="event-date-container">
                            <label for="event-date" class="form-label"
                                >Event Date</label
                            >
                            <input
                                type="date"
                                id="event-date"
                                class="form-control"
                            />
                        </div>

                        <div class="mb-3 d-none" id="advanced-event-container">
                            <button
                                type="button"
                                class="btn btn-outline-secondary w-100 mb-2"
                                id="advanced-event-button"
                            >
                                Advanced Event Config
                            </button>

                            <div
                                id="advanced-event-fields"
                                class="d-none border rounded p-3 bg-light"
                            >
                                <h6 class="mb-3">Advanced Event Settings</h6>

                                <div class="mb-3">
                                    <label
                                        for="event-location"
                                        class="form-label"
                                        >Location</label
                                    >
                                    <span
                                        data-bs-toggle="tooltip"
                                        title="The location of the event."
                                    >
                                        <i
                                            class="bi bi-question-circle-fill text-secondary"
                                            style="cursor: pointer"
                                        ></i>
                                    </span>
                                    <input
                                        type="text"
                                        id="event-location"
                                        class="form-control"
                                        placeholder="e.g. 123 Main St, New York"
                                    />
                                </div>

                                <div class="mb-3">
                                    <label
                                        for="event-description"
                                        class="form-label"
                                        >Description</label
                                    >
                                    <span
                                        data-bs-toggle="tooltip"
                                        title="The description of the event."
                                    >
                                        <i
                                            class="bi bi-question-circle-fill text-secondary"
                                            style="cursor: pointer"
                                        ></i>
                                    </span>
                                    <textarea
                                        id="event-description"
                                        class="form-control"
                                        rows="3"
                                        placeholder="Event details, notes, etc."
                                    ></textarea>
                                </div>

                                <div class="mb-3">
                                    <label
                                        for="event-start-hour"
                                        class="form-label"
                                        >Start hour</label
                                    >
                                    <span
                                        data-bs-toggle="tooltip"
                                        title="The start hour of the event, in military time."
                                    >
                                        <i
                                            class="bi bi-question-circle-fill text-secondary"
                                            style="cursor: pointer"
                                        ></i>
                                    </span>
                                    <input
                                        type="number"
                                        id="event-start-hour"
                                        class="form-control"
                                        placeholder="10"
                                        value="10"
                                    />
                                </div>

                                <div class="mb-3">
                                    <label for="event-length" class="form-label"
                                        >Event length in hours</label
                                    >
                                    <span
                                        data-bs-toggle="tooltip"
                                        title="How long the event will last, in hours."
                                    >
                                        <i
                                            class="bi bi-question-circle-fill text-secondary"
                                            style="cursor: pointer"
                                        ></i>
                                    </span>
                                    <input
                                        type="number"
                                        id="event-length"
                                        class="form-control"
                                        placeholder="5"
                                        value="5"
                                    />
                                </div>

                                <div class="mb-3">
                                    <label
                                        for="event-recurrence"
                                        class="form-label"
                                        >Recurrence Rule</label
                                    >
                                    <span
                                        data-bs-toggle="tooltip"
                                        title="Advanced stuff for Google Calendar integration, you can leave this blank the majority of the time."
                                    >
                                        <i
                                            class="bi bi-question-circle-fill text-secondary"
                                            style="cursor: pointer"
                                        ></i>
                                    </span>
                                    <input
                                        type="text"
                                        id="event-recurrence"
                                        class="form-control"
                                        placeholder="e.g. RRULE:FREQ=WEEKLY;COUNT=4"
                                    />
                                    <small class="text-muted"
                                        >Leave blank if not repeating.</small
                                    >
                                </div>
                            </div>
                        </div>

                        <button
                            class="btn btn-info btn-large w-100"
                            id="post_button"
                        >
                            Post
                        </button>
                    </div>
                </div>
            </div>
        </main>

        <footer></footer>

        <script src="scripts/bootstrap.js"></script>
        <script src="scripts/simplemde.js"></script>
        <script src="scripts/create_post.js"></script>
    </body>
</html>
