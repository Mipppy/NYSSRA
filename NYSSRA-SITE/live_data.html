<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>404 - Page Not Found</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" href="/images/nyssra-logo.jpg" />

    <link rel="stylesheet" href="css/global.css" />
    <link rel="stylesheet" href="css/bootstrap.css" />
    <link rel="stylesheet" href="css/bootstrap-icons.css" />

    <style>
        html,
        body {
            height: 100%;
            margin: 0;
        }

        body {
            display: flex;
            flex-direction: column;
        }

        main {
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            text-align: center;
        }
    </style>
</head>

<body class="min-vh-100 d-flex flex-column">
    <nav></nav>

    <main class="py-4">
        <div class="d-flex rounded" style="min-height: 200px;max-width: 80%; width: 80%;"
            id="race-data-container">
            <div id="loading" class="align-self-center justify-content-center p-2">
                <h1>Loading...</h1>
                <hr>
                <h5>
                    Getting the most up-to-date race data! <br> Please hold on!
                </h5>
            </div>
            <div style="display:none" id="failed-to-load" class="align-self-center justify-content-center p-2">
                <h1>Sorry...</h1>
                <hr>
                <h5>
                    The race data could not be found for this race.
                </h5>
            </div>
            <div id="actual-data" class="d-none row" style="width:100%;">
                <div id="header-container"
                    class="d-flex align-items-center justify-content-between p-2 m-2 border rounded bg-light">
                    <div class="d-flex align-items-center gap-3 border shadow-lg rounded p-2">
                        <h4 id="race-name" class="mb-0 fw-bold"></h4>
                        <br>
                        <div class="d-flex align-items-center text-secondary">
                            <i class="bi bi-geo-alt"></i> <span id="race-location"></span>
                            <i class="bi bi-clock ms-3"></i> <span id="race-start-time"></span>
                        </div>
                    </div>

                    <div class="d-flex align-items-center gap-3">
                        <div id="race-status" class="status-dot"></div>
                        <span id="race-status-text" class="fw-semibold"></span>

                        <button id="refresh-btn" class="btn btn-sm p-0 border-0" disabled
                            title="Auto refreshing every 500ms">
                            <i class="bi bi-arrow-clockwise fs-5 text-secondary"></i>
                        </button>

                        <div id="extra-header-data" class="text-end text-secondary small">
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <footer></footer>
    <style>
        #header-container {
            min-height: 50px;
        }

        .status-dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            display: inline-block;
            position: relative;
        }

        .status-dot.live {
            background-color: #198754;
        }

        .status-dot.live::after {
            content: "";
            position: absolute;
            left: 50%;
            top: 50%;
            width: 100%;
            height: 100%;
            background-color: #198754;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            animation: pulse-ring 1.5s infinite;
            opacity: 0.6;
        }

        .status-dot.recent {
            background-color: #0d6efd;
        }

        .status-dot.finished {
            background-color: #dc3545;
        }

        @keyframes pulse-ring {
            0% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 0.6;
            }

            70% {
                transform: translate(-50%, -50%) scale(2.5);
                opacity: 0;
            }

            100% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 0;
            }
        }

        #refresh-btn {
            cursor: not-allowed;
            background: transparent;
        }
    </style>
    <script src="scripts/bootstrap.js"></script>
    <script src="scripts/navbar.js"></script>
    <script src="scripts/live_data.js"></script>
</body>

</html>
